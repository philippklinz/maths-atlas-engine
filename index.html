<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b31">
  <title>Maths Atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/atlas.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#lesebereich">Zum Inhalt</a>
  <header class="mast"><div class="mast-inner">
    <a class="brand" href="./" aria-label="Maths Atlas, Startseite"><span class="brand-glyph" aria-hidden="true">∿</span> Maths Atlas</a>
    <span class="chapter" id="chapter"></span>
    <label class="theme-control"><span class="sr">Farbschema</span><select id="theme"><option value="system">Systemfarben</option><option value="light">Hell</option><option value="dark">Dunkel</option></select></label>
  </div></header>
  <div class="shell">
    <aside class="directory">
      <details id="directory">
        <summary><span>Verzeichnis</span><span id="entry-count" class="count"></span></summary>
        <div class="directory-inner">
          <label for="catalog-search">Einträge suchen</label>
          <input type="search" id="catalog-search" placeholder="Titel, Formel oder Begriff" autocomplete="off">
          <nav id="catalog" aria-label="Einträge"></nav>
        </div>
      </details>
    </aside>
    <main id="lesebereich" tabindex="-1">
      <div id="navigation"></div>
      <article id="article" aria-busy="true"><p role="status">Der Atlas wird geladen …</p></article>
      <noscript>Bitte aktiviere JavaScript, um die Einträge und ihre Verbindungen zu öffnen.</noscript>
    </main>
  </div>
</body>
</html>
