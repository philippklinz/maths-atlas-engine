<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b31">
  <title>Maths Atlas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/atlas.css">
  <link rel="stylesheet" href="./assets/shell.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip" href="#lesebereich">Zum Inhalt</a>
  <div class="shell">
    <aside class="directory" aria-label="Atlasnavigation">
      <a class="brand" href="./" aria-label="Maths Atlas, Startseite"><span class="brand-glyph" aria-hidden="true">∿</span><span>Maths Atlas<small>Learning Labs</small></span></a>
      <div class="rail-label">Der Atlas</div>
      <nav id="rail-nav" aria-label="Übersicht"></nav>
      <details id="directory">
        <summary><span class="index-icon" aria-hidden="true">≡</span><span>Verzeichnis</span></summary>
        <div class="directory-inner">
          <label for="catalog-search">Atlasweit suchen</label>
          <input type="search" id="catalog-search" placeholder="z. B. Kreis oder π" autocomplete="off">
          <nav id="catalog" aria-label="Verzeichnis">
            <div id="catalog-tree"></div>
            <div id="catalog-results" hidden></div>
          </nav>
        </div>
      </details>
      <footer class="rail-footer">
        <span id="entry-count"></span>
        <a href="https://github.com/philippklinz/maths-atlas-content">Inhalte auf GitHub</a>
      </footer>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="control labs-link" href="https://philipp-klinz.net/learning-labs/"><span aria-hidden="true">←</span> Learning Labs</a>
        <label class="theme-control"><span>Farbschema</span><select id="theme"><option value="system">Systemfarben</option><option value="light">Hell</option><option value="dark">Dunkel</option></select></label>
      </header>
      <main class="page" id="lesebereich" tabindex="-1">
        <nav id="breadcrumbs" aria-label="Themenpfad"></nav>
        <div id="navigation"></div>
        <article id="article" aria-busy="true"><p role="status">Der Atlas wird geladen …</p></article>
        <noscript>Bitte aktiviere JavaScript, um die Einträge und ihre Verbindungen zu öffnen.</noscript>
      </main>
    </div>
  </div>
</body>
</html>
